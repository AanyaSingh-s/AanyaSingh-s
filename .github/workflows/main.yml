name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: AanyaSingh-s
          outputs: |
            dist/snake.svg?color_snake=gradient(#00f0ff,#a100ff)&color_dots=#0d1117,#0f3d3e,#00f0ff,#6f00ff,#a100ff

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
